<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>ePen</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: transparent !important;
        height: 100vh;
        width: 100vw;
      }
      body {
        background: transparent !important;
        position: relative;
        backdrop-filter: none;
      }
      canvas {
        display: block;
        background: transparent !important;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        mix-blend-mode: normal;
      }
      #toolbar {
        position: fixed;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 5px;
        box-shadow: 0 0 5px rgba(0,0,0,0.2);
        display: flex;
        gap: 10px;
        align-items: center;
        z-index: 1000;
        backdrop-filter: blur(5px);
        white-space: nowrap;
      }
      #titleBar {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        padding: 5px 10px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 0 0 5px 5px;
        box-shadow: 0 0 5px rgba(0,0,0,0.2);
        display: flex;
        gap: 10px;
        align-items: center;
        z-index: 9999;
        -webkit-app-region: drag;
        cursor: move;
      }
      /* Diğer mevcut stiller burada kalacak */
    </style>
  </head>
  <!-- Diğer mevcut HTML içeriği burada kalacak -->
</html>
